[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xasweb-pilot"
version = "0.5.2rc5"
description = "An inspectable local web workflow for XAS reduction with Larch"
requires-python = ">=3.12"
dependencies = [
    "xraylarch==2026.3.1",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "python-multipart==0.0.32",
]

[tool.setuptools.packages.find]
include = ["xasweb*"]
namespaces = false

[tool.setuptools.package-data]
xasweb = ["static/*", "knowledge/catalog.json", "gallery/*", "data/pro-demo.zip", "data/PARSEQ-XAS-LICENSE.txt"]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["package/app/tests"]
